[project]
name = "nearmap-cost-ui"
version = "0.1.0"
description = "Streamlit app to estimate Nearmap API credit cost for an AOI and selected resources (by_area vs by_api_return)."
readme = "README.md"
# Lower bound matches the deploy target (Dockerfile uses python:3.11-slim);
# local dev is pinned to 3.12 via .python-version.
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.15.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
]

# Dev/test tooling (PEP 735 group). `uv sync` installs this by default; the Docker
# image and Streamlit Cloud install from requirements.txt (runtime only), so dev
# dependencies are never shipped to production.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

# This is an application, not an installable library — don't try to build a wheel
# from the repo root during `uv sync`.
[tool.uv]
package = false

# All tests + the validation harness live under tests/ (a package, so the live/report
# scripts run as `python -m tests.run_live_validation` / `python -m tests.generate_report`).
[tool.pytest.ini_options]
testpaths = ["tests"]
