name: CD

on:
  # Publish `latest` on every merge to main.
  push:
    branches: [main]
    # Publish semver-tagged images when you cut a release tag (e.g. v1.2.0).
    tags: ["v*"]
  # Allow publishing on demand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: nothing publishes unless the offline suite passes first. Runs on 3.11,
  # the version the image actually ships (python:3.11-slim). The full 3.11/3.12
  # matrix lives in CI; this is the release-time safety check.
  test:
    name: Test (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (incl. dev group)
        run: uv sync --python 3.11

      - name: Run tests
        run: uv run --python 3.11 pytest -v

  publish:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Derive image tags/labels from the git ref:
      #   - push to main       -> :latest + :main-<sha>
      #   - push tag vX.Y.Z     -> :X.Y.Z, :X.Y, :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/nearmap-cost-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
